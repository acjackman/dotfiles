# Tuna version the .chezmoitemplates/tuna/ fragments were last re-synced
# against. Tuna rewrites config.toml on upgrade, so a mismatch with the
# installed app means the fragments are probably stale — `,doctor-tuna`
# compares the two and says so. Bump this when you re-sync the fragments.
tuna_synced_version: "0.98"

gh_extensions:
  - dlvhdr/gh-dash
  - github/gh-stack

sketchybar:
  # Compact mode shifts items to the left half of the bar (avoiding the MBP
  # notch) and hides empty aerospace workspaces. Enable per-machine in
  # ~/.config/chezmoi/chezmoi.toml: [data.sketchybar] compact = true
  compact: false
  stats:
    cpu: true
    memory: true
    disk_volumes:
      - /

linearmouse_trackpads:
  - productID: "0x265"
    productName: "Magic Trackpad"
    vendorID: "0x5ac"
  - productID: "0x324"
    productName: "Magic Trackpad"
    vendorID: "0x5ac"
