# CleanShot X. Restart it to pick up changes. The save folder is in
# cleanshotx-paths.toml.tmpl (it needs the home directory).
#
# Shortcuts are data: hex of JSON {"carbonModifiers":<mod>,"carbonKey":<key>}.
# Modifiers: 256=Cmd, 512=Shift, 768=Cmd+Shift, 2048=Opt, 4096=Ctrl.
# Key codes: 18=1, 19=2, 20=3, 21=4, 22=5, 23=6, 26=7, 36=Return, 49=Space.
domain = "pl.maketheweb.cleanshotx"

[values]
# Capture Area — Cmd+Shift+4
"LAVAtakeArea" = { data = "7b22636172626f6e4d6f64696669657273223a3736382c22636172626f6e4b6579223a32317d" }

# Capture Fullscreen — Cmd+Shift+3
"LAVAtakeFullscreen" = { data = "7b22636172626f6e4d6f64696669657273223a3736382c22636172626f6e4b6579223a32307d" }

# All-in-One — Cmd+Shift+6
"LAVAtakeAllInOne" = { data = "7b22636172626f6e4d6f64696669657273223a3736382c22636172626f6e4b6579223a32337d" }

# OCR (Text Recognition) — Cmd+Shift+1
"LAVAtakeOCR" = { data = "7b22636172626f6e4d6f64696669657273223a3736382c22636172626f6e4b6579223a31387d" }

# OCR with Line Breaks — Cmd+Shift+2
"LAVAtakeOCRWithLineBreaks" = { data = "7b22636172626f6e4d6f64696669657273223a3736382c22636172626f6e4b6579223a31397d" }

# Quick Access Overlay: Restore — Cmd+Shift+7
"LAVAqaoRestore" = { data = "7b22636172626f6e4d6f64696669657273223a3736382c22636172626f6e4b6579223a32367d" }

# Quick Access Overlay: Restore Last from History — Cmd+Shift+5
"LAVAqaoRestoreLastFromHistory" = { data = "7b22636172626f6e4d6f64696669657273223a3736382c22636172626f6e4b6579223a32327d" }

# Freeze screen during capture (shows static snapshot while selecting area)
"freezeScreen" = true

# Hide desktop icons during capture
"captureWithoutDesktopIcons" = true

# Disable sound effects
"playSounds" = false

# Disable magnifier (loupe) during capture
"showMagnifier" = false

# Enable DND while recording video
"doNotDisturbWhileRecording" = true

# Keep capture on current display (don't move to active display)
"moveToActiveDisplay" = false

# Crosshair display mode (2 = full crosshair)
"crosshairMode" = 2

# Transparent background in annotation editor
"transparentWindowBackground" = true

# Snap to edges when cropping in annotation editor
"snapInAnnotateCrop" = true

# Popup size (0=small, 1=medium, 2=large, 3=extra large)
"popupSize" = 3

# Show popup on left edge of screen
"popupOnLeftEdge" = true

# Auto-close popup after 30 seconds
"autoClosePopup" = true
"popupAutoCloseInterval" = 30

# Don't prompt for save destination (use default export path)
"popupAskForDestinationWhenSaving" = false

# Close popup after dragging screenshot out
"deletePopupAfterDragging" = true

# Keep 4 screenshots in history
"historyCapacity" = 4

# After screenshot: copy to clipboard (0), save to disk (1), show in Quick Access (3)
"afterScreenshotActions" = ["0", "1", "3"]

# After video: copy to clipboard (0), save to disk (1)
"afterVideoActions" = ["0", "1"]

# Disable automatic updates (managed via Homebrew)
"SUAutomaticallyUpdate" = false
"SUEnableAutomaticChecks" = false
